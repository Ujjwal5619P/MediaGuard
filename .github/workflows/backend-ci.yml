name: Backend CI

on:
  push:
    branches:
      - main
      - feature/lightweight-cpu-detector
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python tests and compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MEDIAGUARD_LIGHTWEIGHT_MODE: "true"
      MEDIAGUARD_AUTO_DOWNLOAD_MODELS: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-render.txt

      - name: Install CPU backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-render.txt "pytest>=8.2.0,<9.0.0" "httpx>=0.27.0,<1.0.0"

      - name: Compile backend Python files
        run: python -m compileall -q app run_server.py setup_models.py evaluate_dataset.py tests

      - name: Run backend test suite
        run: python -m pytest -q
