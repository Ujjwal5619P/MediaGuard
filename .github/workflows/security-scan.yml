
name: Dependency Security Scan

on:
  push:
    branches:
      - main
      - feature/lightweight-cpu-detector
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Audit Python project dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit backend requirements
        continue-on-error: true
        run: |
          echo "Auditing backend requirements..."
          pip-audit -r backend/requirements.txt || echo "Vulnerabilities found in backend requirements."

          echo "Auditing lightweight deployment requirements..."
          pip-audit -r backend/requirements-render.txt || echo "Vulnerabilities found in deployment requirements."

  npm-dependencies:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
